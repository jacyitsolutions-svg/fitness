:root{
  --bg:#EEF0ED; --surface:#FFFFFF; --ink:#1D2327; --muted:#626B70; --line:#D8DCD9; --soft:#E2E5E2;
  --gym:#2D5BA6; --gym-ink:#FFFFFF;
  --cardio:#E2AA22; --cardio-ink:#1D2327; --cardio-strong:#9A700A;
  --rest:#A7AEB1; --done:#2F8A57; --bad:#C43D34;
  --display:"Shoulders","Roboto Condensed","Arial Narrow",sans-serif;
  --body:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161B1E; --surface:#20272B; --ink:#E8ECEA; --muted:#9AA3A7; --line:#323B40; --soft:#2A3337;
    --gym:#5E89D4; --gym-ink:#0E1417;
    --cardio:#E7B53A; --cardio-ink:#0E1417; --cardio-strong:#E7B53A;
    --rest:#5F686C; --done:#4DB27A; --bad:#E3665E;
    color-scheme:dark;
  }
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
p,h1,h2,h3,ul{margin:0}
ul{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gym);outline-offset:2px}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:14px}
.small{font-size:13px}
.center{text-align:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
body.no-nav .app{padding-bottom:calc(40px + env(safe-area-inset-bottom))}

/* Top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.title{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;letter-spacing:.3px}
.title.sm{font-size:30px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--soft)}
.link{border:0;background:none;color:var(--gym);font-weight:600;font-size:15px;padding:10px 2px;display:inline-flex;align-items:center;gap:6px}
.link .i{width:18px;height:18px}
.link.danger{color:var(--bad)}
.notice{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* Buttons */
.btn{border:0;border-radius:999px;padding:11px 18px;min-height:48px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--soft)}
.btn .i{width:20px;height:20px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.good{background:var(--done);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}

/* Section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
.sec h2{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.1}

/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 0;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Plate discs */
.disc{--c:var(--muted);--ci:var(--ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  font-family:var(--display);font-weight:800;font-size:18px;line-height:1;color:var(--ink);border:2px solid transparent}
.disc.t-gym{--c:var(--gym);--ci:var(--gym-ink)}
.disc.t-cardio{--c:var(--cardio);--ci:var(--cardio-ink)}
.disc.s-none{color:var(--muted)}
.disc.s-planned{border-color:var(--c)}
.disc.s-progress{border:5px solid var(--c)}
.disc.s-done{background:var(--c);color:var(--ci)}
.disc.s-incomplete{border-color:var(--bad);color:var(--bad)}
.disc.s-incomplete::after{content:"";position:absolute;left:14%;right:14%;top:calc(50% - 1px);height:2px;background:var(--bad);transform:rotate(-45deg)}
.disc.s-missed{border:2px dashed var(--muted);color:var(--muted)}
.disc.s-rest{background:var(--soft);color:var(--muted)}
.disc.is-today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

/* Today card */
.today{background:var(--surface);border-radius:20px;padding:16px;margin-top:4px}
.today-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.today-type{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.chip{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.chip.t-gym{background:var(--gym);color:var(--gym-ink)}
.chip.t-cardio{background:var(--cardio);color:var(--cardio-ink)}
.chip.t-rest{background:var(--soft);color:var(--muted)}
.today-list{margin:-4px 0 14px}
.today-list li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.today-list li .i{width:18px;height:18px;color:var(--muted)}
.today-list li.is-done .i{color:var(--done);stroke-width:2.6}
.today-list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-list li .sub{white-space:nowrap}
.status-done{color:var(--done);font-weight:600}
.status-incomplete{color:var(--bad);font-weight:600}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-radius:20px;padding:10px 4px}
.strip button{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.strip .wd{font-size:12px;color:var(--muted)}
.streak{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;font-size:15px}
.streak .i{color:var(--bad)}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;border-top:1px solid var(--line)}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{padding:14px 10px 12px 0;border-bottom:1px solid var(--line);min-width:0}
.stat.r{padding-left:14px;border-left:1px solid var(--line)}
.stat.wide{grid-column:1/-1}
.stat .v{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;overflow-wrap:anywhere}
.stat.wide .v{font-size:28px}
.stat .v small{font-size:19px;font-weight:600;margin-left:2px;color:var(--muted)}
.stat .l{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.3}

/* Weight */
.wmini{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:14px 16px}
.big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.big small{font-size:22px;font-weight:600;margin-left:3px;color:var(--muted)}
.spark{width:42%;max-width:180px;color:var(--gym)}
.wquick,.wform{display:flex;align-items:flex-end;gap:10px;margin-top:12px}
.wform{background:var(--surface);border-radius:20px;padding:14px;margin-top:4px}
.wform .field:first-child{flex:1.7}
.wform input[type=date]{font-size:15px;padding:6px 8px}
.wform .field{flex:1}
.chart{background:var(--surface);border-radius:20px;padding:12px 10px 6px;margin-top:10px;color:var(--gym)}
.chart svg{display:block;width:100%;height:auto}
.ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart-empty{padding:18px 8px;color:var(--muted);font-size:14px;text-align:center}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 0 6px 2px;border-bottom:1px solid var(--line)}
.hrow .main{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;border:0;background:none;padding:6px 0;text-align:left}
.hrow .val{font-family:var(--display);font-weight:800;font-size:24px;min-width:72px}
.hrow .diff{font-size:14px;color:var(--muted);min-width:56px;text-align:right}

/* Calendar */
.pager{display:flex;align-items:center;gap:4px;margin:0 0 12px}
.pager-label{flex:1;text-align:center}
.pager-label b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;background:var(--surface);border-radius:20px;padding:12px 4px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button{border:0;background:none;display:grid;place-items:center;padding:3px 0}
.cal .disc{width:40px;height:40px}
.cal-sum{margin:14px 2px 0;font-size:15px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:20px 2px 10px;font-size:14px}
.legend div{display:flex;align-items:center;gap:10px}
.legend .disc{width:28px;height:28px;font-size:14px}

/* Plan week */
.rows{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;display:block}
.row .name{display:flex;align-items:center;gap:8px;font-weight:600}
.row .desc{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--muted);width:18px;height:18px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.tag .i{width:16px;height:16px}
.tag.t-gym{color:var(--gym)}
.tag.t-cardio{color:var(--cardio-strong)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.empty{background:var(--surface);border-radius:20px;padding:22px 18px;text-align:center;margin-top:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty p:first-child{font-weight:600}
.empty .btn{margin-top:10px}

/* Day editor */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px}
.type{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:16px;padding:14px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.type .i{width:26px;height:26px}
.type.t-gym[aria-pressed="true"]{background:var(--gym);color:var(--gym-ink);box-shadow:none}
.type.t-cardio[aria-pressed="true"]{background:var(--cardio);color:var(--cardio-ink);box-shadow:none}
.type.t-rest[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.ex{background:var(--surface);border-radius:16px;padding:12px;margin-bottom:10px}
.ex-top{display:flex;align-items:center;gap:8px}
.ex-name{font-weight:600;line-height:1.25}
.hint{font-size:13px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.nums.two{grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-height:46px}
.inp:focus{border-color:var(--ink);outline:none}
.inp.num{font-family:var(--display);font-weight:800;font-size:24px;padding:4px 8px;text-align:center}
select.inp{appearance:auto}
.check{width:46px;height:46px;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px var(--line);background:transparent;display:grid;place-items:center;flex:none;color:var(--line)}
.check .i{width:24px;height:24px;stroke-width:2.6}
.check[aria-pressed="true"]{background:var(--done);box-shadow:none;color:#fff}
.ex.log.is-done{box-shadow:inset 0 0 0 2px var(--done)}
.statusbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.banner{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;margin:0 0 10px;font-weight:600;background:var(--surface)}
.banner.done{box-shadow:inset 0 0 0 2px var(--done);color:var(--done)}
.banner.incomplete{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.banner .link{color:var(--ink)}
.rest-note{background:var(--surface);border-radius:20px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);text-align:center}
.rest-note .i{width:34px;height:34px}
.day-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-top:10px}
.wday{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 14px}
.wday .inp{max-width:130px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav[hidden]{display:none}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.nav button .i{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"] .i{stroke-width:2.4}

/* Sheets and toast */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,12,14,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));animation:rise .2s ease-out}
.sheet h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin-bottom:6px}
.sheet .field{margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:0}
.opt input[type=radio],.check-row input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.opt .grow>b{display:block;font-weight:600}
.opt .inp{margin-top:8px}
.opt select.inp{display:inline-block;width:auto;min-height:40px;margin:0 4px;padding:4px 8px}
.check-row{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:15px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.set-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row .i{color:var(--muted)}
.set-row b{display:block;font-weight:600}
.set-row.danger,.set-row.danger .i{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;min-height:44px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .15s ease-out}
.toast:not(:has(button)){padding-right:18px}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;padding:6px 10px;text-decoration:underline}
body.no-nav .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.stat .v{font-size:32px}.cal .disc{width:36px;height:36px}.title{font-size:32px}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="nav" id="nav" aria-label="Main">
  <div class="nav-in">
    <button data-act="tab" data-tab="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg><span>Home</span></button>
    <button data-act="tab" data-tab="calendar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
    <button data-act="tab" data-tab="plan"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16.5" rx="2.5"/><path d="M9 3h6v3H9z"/><path d="M8.5 11h7M8.5 15h4.5"/></svg><span>Plan</span></button>
    <button data-act="tab" data-tab="weight"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 11a4 4 0 0 1 8 0"/><path d="M12 11l1.8-2.2"/></svg><span>Weight</span></button>
  </div>
</nav>
<noscript>Plates needs JavaScript turned on.</noscript>

<script>
(() => {
'use strict';

/* ---------------- Utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const numOr = v => { if (v === '' || v == null) return ''; const n = parseFloat(v); return isFinite(n) ? n : ''; };
const joinList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const isKey = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const todayKey = () => keyOf(new Date());
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const fmtDay = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
const fmtShort = k => { const d = fromKey(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtRange = (a, b) => a.getMonth() === b.getMonth()
  ? `${a.getDate()}–${b.getDate()} ${MON[a.getMonth()]}`
  : `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;
function relDay(k) {
  const t = today();
  if (k === keyOf(t)) return 'Today';
  if (k === keyOf(addDays(t, 1))) return 'Tomorrow';
  if (k === keyOf(addDays(t, -1))) return 'Yesterday';
  return '';
}
const fmtNum = (n, dp = 1) => {
  if (n === '' || n == null || !isFinite(n)) return '–';
  return (Math.round(n * 10 ** dp) / 10 ** dp).toLocaleString('en-US', { maximumFractionDigits: dp });
};
const fmtW = n => (n === '' || n == null || !isFinite(n)) ? '–' : (Math.round(n * 10) / 10).toFixed(1);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmtNum(Math.abs(n));
function fmtMinutes(m) {
  m = Math.round(m);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

const UNITS = {
  min: { one: 'min', many: 'min', name: 'Minutes' },
  hr: { one: 'hour', many: 'hours', name: 'Hours' },
  km: { one: 'km', many: 'km', name: 'Kilometres' },
  session: { one: 'session', many: 'sessions', name: 'Sessions' }
};
const unitLabel = (u, a) => (a === 1 ? UNITS[u].one : UNITS[u].many);

const ICONS = {
  gym: '<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  cardio: '<path d="M3 12.5h4l2.2-5.5 4.3 11 2.3-5.5H21"/>',
  rest: '<path d="M19.5 14.5A7.8 7.8 0 1 1 9.5 4.5a6.2 6.2 0 0 0 10 10z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  dot: '<circle cx="12" cy="12" r="3.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  left: '<path d="M14.5 5.5 8 12l6.5 6.5"/>',
  right: '<path d="M9.5 5.5 16 12l-6.5 6.5"/>',
  back: '<path d="M19 12H5.5M11 6l-6 6 6 6"/>',
  trash: '<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.8 12.2a1 1 0 0 0 1 .8h7.4a1 1 0 0 0 1-.8L17.5 7M9.5 7V4.5h5V7"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9.5a1 1 0 0 0 1 1h3.5"/>',
  flame: '<path d="M12 3.5c.8 3.6 5 5.3 5 9.8a5 5 0 0 1-10 0c0-2.4 1.3-3.6 2-5.1.9 1.3 1.8 1.8 1.8 1.8-.2-2.7.6-4.5 1.2-6.5z"/>',
  download: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
  upload: '<path d="M12 16V5M7 9.5l5-5 5 5M5 20h14"/>'
};
const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const iconBtn = (act, ic, label, extra = '') => `<button class="icon-btn" data-act="${act}" aria-label="${esc(label)}" ${extra}>${icon(ic)}</button>`;

/* ---------------- Storage ---------------- */
const STORE_KEY = 'plates.data.v1';
const Store = (() => {
  let ok = false, mem = null;
  try { localStorage.setItem('__plates', '1'); localStorage.removeItem('__plates'); ok = true; } catch (e) {}
  return {
    persistent: ok,
    load() { try { return ok ? JSON.parse(localStorage.getItem(STORE_KEY) || 'null') : mem; } catch (e) { return null; } },
    save(d) {
      const s = JSON.stringify(d);
      if (ok) { try { localStorage.setItem(STORE_KEY, s); return; } catch (e) { toast('Could not save. Phone storage may be full.'); } }
      mem = JSON.parse(s);
    }
  };
})();

const blank = () => ({ v: 1, days: {}, weights: {} });
function fixItem(it, kind) {
  it = it && typeof it === 'object' ? it : {};
  const p = it.plan || {}, a = it.actual;
  return {
    id: String(it.id || uid()),
    name: String(it.name ?? ''),
    plan: kind === 'gym'
      ? { sets: numOr(p.sets), reps: numOr(p.reps), weight: numOr(p.weight) }
      : { amount: numOr(p.amount), unit: UNITS[p.unit] ? p.unit : 'min' },
    actual: a && typeof a === 'object'

let data = normalize(Store.load());

/* ---------------- Domain helpers ---------------- */
const ensureDay = k => data.days[k] || (data.days[k] = { type: null, gym: [], cardio: [], status: null });

function stateOf(k) {
  const d = data.days[k];
  if (!d || !d.type) return 'none';
  if (d.type === 'rest') return 'rest';
  if (d.status) return d.status;
  if (itemsOf(d).some(i => i.done)) return 'progress';

}
const STATE_LABEL = { none: 'no plan', rest: 'rest day', planned: 'planned', progress: 'partly logged', done: 'done', incomplete: 'incomplete', missed: 'not logged' };

function describe(it, kind, get) {
  if (kind === 'gym') {
    const s = get(it, 'sets'), r = get(it, 'reps'), w = get(it, 'weight');
    let t = '';
    if (s !== '' || r !== '') t = `${s === '' ? '?' : s} × ${r === '' ? '?' : r}`;
    if (w !== '') t += `${t ? ', ' : ''}${fmtNum(w)} kg`;
    return t;
  }
  const a = get(it, 'amount');
  return a === '' ? '' : `${fmtNum(a)} ${unitLabel(it.plan.unit, a)}`;
}
const itemText = (it, kind) => describe(it, kind, val);
const planText = (it, kind) => describe(it, kind, (i, f) => i.plan[f]);

function daySummary(d) {
  const its = itemsOf(d);
  if (!its.length) return d.type === 'gym' ? 'No exercises added yet' : 'No activities added yet';
  if (d.type === 'cardio') return its.map(i => [i.name || 'Untitled', itemText(i, 'cardio')].filter(Boolean).join(' ')).join(', ');
  const names = its.map(i => i.name || 'Untitled');
  return names.length > 2 ? `${names.slice(0, 2).join(', ')} and ${names.length - 2} more` : names.join(', ');
}

function statsFor(start, end) {
  const t = todayKey();
  const s = { planned: 0, due: 0, done: 0, incomplete: 0, missed: 0, rest: 0, itemsDone: 0, itemsDue: 0, volume: 0, min: 0, km: 0, sessions: 0 };
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const k = keyOf(d), day = data.days[k], st = stateOf(k);
    if (st === 'none') continue;
    if (st === 'rest') { s.rest++; continue; }
    s.planned++;
    if (k < t || (k === t && isLogged(day))) s.due++;
    if (st === 'done') s.done++;
    else if (st === 'incomplete') s.incomplete++;
    else if (st === 'missed') s.missed++;
    for (const it of itemsOf(day)) {
      if (k <= t) s.itemsDue++;
      if (!it.done) continue;
      s.itemsDone++;
      if (day.type === 'gym') {
        s.volume += (+val(it, 'sets') || 0) * (+val(it, 'reps') || 0) * (+val(it, 'weight') || 0);
      } else {
        const a = +val(it, 'amount') || 0, u = it.plan.unit;

}
function cardioParts(s) {
  const p = [];
  if (s.min) p.push(fmtMinutes(s.min));
  if (s.km) p.push(`${fmtNum(s.km)} km`);
  if (s.sessions) p.push(`${fmtNum(s.sessions)} ${s.sessions === 1 ? 'session' : 'sessions'}`);

}
const weightKeys = () => Object.keys(data.weights).sort();
function weightChange(fromK, toK) {
  const ks = weightKeys().filter(k => k >= fromK && k <= toK);

}

  const keys = Object.keys(data.days).sort();
  if (!keys.length) return 0;
  const t = todayKey();
  let n = 0, d = today();
  for (let i = 0; i < 1000; i++) {
    const k = keyOf(d);
    if (k < keys[0]) break;
    const st = stateOf(k);

}
function clonePlan(s) {
  return {
    type: s.type, status: null,
    gym: s.gym.map(i => ({ id: uid(), name: i.name, plan: { ...i.plan }, actual: null, done: false })),
    cardio: s.cardio.map(i => ({ id: uid(), name: i.name, plan: { ...i.plan }, actual: null, done: false }))

}
function applyCopy(pairs) {
  let copied = 0, skipped = 0;
  for (const [sk, tk] of pairs) {

    const tgt = data.days[tk];
    if (isLogged(tgt)) { skipped++; continue; }

}

function lineChart(points, { w = 340, h = 160, pad = 8, axes = false } = {}) {

  h += mode === 'plan' ? planEditor(k, d, canLog) : logView(d);
  if (canLog) {
    const w = data.weights[k];
    h += `<div class="sec"><h2>Body weight</h2></div><label class="wday"><span class="grow">Weight on this day</span><input class="inp num" type="number" inputmode="decimal" step="any" min="0" placeholder="0.0" data-wday="${k}" value="${w ?? ''}" aria-label="Body weight in kg"><span class="sub">kg</span></label>`;
  }
  return h;
}

function numField(label, bind, it, v, mode) {
  return `<label class="field"><span>${label}</span><input class="inp num" type="number" inputmode="${mode}" step="any" min="0" data-bind="${bind}" data-id="${it.id}" value="${v === '' || v == null ? '' : v}"></label>`;
}
function planEditor(k, d, canLog) {
  const type = d && d.type;
  let h = `<div class="types" role="group" aria-label="Day type">${[['gym', 'Gym'], ['cardio', 'Cardio'], ['rest', 'Rest']].map(([t, l]) => `<button class="type t-${t}" data-act="setType" data-type="${t}" aria-pressed="${type === t}">${icon(t)}<span>${l}</span></button>`).join('')}</div>`;
  if (!type) return h + `<p class="sub center">Choose what this day is for.</p>`;
  if (type === 'rest') {
    h += `<div class="rest-note">${icon('rest')}<p>Rest day. Nothing to log.</p></div>`;
  } else {
    for (const it of itemsOf(d)) {
      const nameInput = `<input class="inp" data-bind="name" data-id="${it.id}" value="${esc(it.name)}" placeholder="${type === 'gym' ? 'Exercise, e.g. Lat pulldown' : 'Activity, e.g. Jogging'}" aria-label="Name" enterkeyhint="next" autocapitalize="sentences">`;
      const del = iconBtn('delItem', 'trash', 'Remove', `data-id="${it.id}"`);
      const nums = type === 'gym'
        ? `<div class="nums">${numField('Sets', 'plan.sets', it, it.plan.sets, 'numeric')}${numField('Reps', 'plan.reps', it, it.plan.reps, 'numeric')}${numField('Weight (kg)', 'plan.weight', it, it.plan.weight, 'decimal')}</div>`
        : `<div class="nums two">${numField('Amount', 'plan.amount', it, it.plan.amount, 'decimal')}<label class="field"><span>Measured in</span><select class="inp" data-bind="plan.unit" data-id="${it.id}">${Object.entries(UNITS).map(([u, x]) => `<option value="${u}"${it.plan.unit === u ? ' selected' : ''}>${x.name}</option>`).join('')}</select></label></div>`;
      h += `<div class="ex"><div class="ex-top">${nameInput}${del}</div>${nums}</div>`;
    }
    h += `<button class="btn ghost block" data-act="addItem">${icon('plus')}${type === 'gym' ? 'Add exercise' : 'Add activity'}</button>`;
  }
  h += `<div class="day-foot"><button class="link" data-act="copyDay">${icon('copy')}Copy to another date</button><button class="link danger" data-act="clearDay">${icon('trash')}Remove plan</button></div>`;
  return h;
}

function logView(d) {
  if (!d || !d.type) return `<div class="empty"><p>No plan for this day.</p><p class="sub">Add what you did in Plan, then come back here to log it.</p><button class="btn ghost" data-act="dayMode" data-mode="plan">Plan this day</button></div>`;
  if (d.type === 'rest') return `<div class="rest-note" style="margin-top:14px">${icon('rest')}<p>Rest day. Nothing to log.</p></div>`;
  const its = itemsOf(d), word = d.type === 'gym' ? 'exercise' : 'activity';
  let h = '<div style="height:14px"></div>';
  if (d.status) h += `<div class="banner ${d.status}">${icon(d.status === 'done' ? 'check' : 'x')}<span class="grow">${d.status === 'done' ? 'Session done' : 'Session marked incomplete'}</span><button class="link" data-act="reopen">Reopen</button></div>`;
  if (!its.length) h += `<div class="empty"><p>No ${word === 'exercise' ? 'exercises' : 'activities'} in this plan yet.</p><button class="btn ghost" data-act="dayMode" data-mode="plan">Add in Plan</button></div>`;
  for (const it of its) {
    const name = esc(it.name || 'Untitled');
    const nums = d.type === 'gym'
      ? `<div class="nums">${numField('Sets', 'actual.sets', it, val(it, 'sets'), 'numeric')}${numField('Reps', 'actual.reps', it, val(it, 'reps'), 'numeric')}${numField('Weight (kg)', 'actual.weight', it, val(it, 'weight'), 'decimal')}</div>`
      : `<div class="nums two">${numField(UNITS[it.plan.unit].name, 'actual.amount', it, val(it, 'amount'), 'decimal')}</div>`;
    const pt = planText(it, d.type);
    h += `<div class="ex log${it.done ? ' is-done' : ''}"><div class="ex-top"><button class="check" data-act="toggleItem" data-id="${it.id}" aria-pressed="${it.done}" aria-label="${it.done ? 'Mark not done' : 'Mark done'}: ${name}">${icon('check')}</button><div class="grow"><p class="ex-name">${name}</p><p class="hint">${pt ? `Plan: ${esc(pt)}` : 'No numbers planned'}</p></div></div>${nums}</div>`;
  }
  if (!d.status) h += `<div class="statusbar"><button class="btn ghost" data-act="markIncomplete">${icon('x')}Incomplete</button><button class="btn good" data-act="allDone">${icon('check')}All done</button></div>`;
  if (its.length) h += `<p class="sub small">Change the numbers to what you actually did, then tick each ${word}.</p>`;
  return h;
}

function viewWeight() {
  const tk = todayKey(), sel = ui.wDate && ui.wDate <= tk ? ui.wDate : tk;
  let h = `<header class="topbar"><div class="grow"><h1 class="title">Body weight</h1></div></header>`;
  h += `<div class="wform"><label class="field"><span>Date</span><input class="inp" type="date" id="wDate" value="${sel}" max="${tk}"></label><label class="field"><span>Weight (kg)</span><input class="inp num" type="number" id="wVal" inputmode="decimal" step="any" min="0" placeholder="0.0" value="${data.weights[sel] ?? ''}"></label><button class="btn primary" data-act="saveWeight">Save</button></div>`;
  const keys = weightKeys();
  if (!keys.length) return h + `<div class="empty"><p>No weigh-ins yet.</p><p class="sub">Add your first entry above. Weighing at the same time each day, such as after waking up, gives the clearest trend.</p></div>`;
  const r = ui.wRange;
  const from = r === 'all' ? keys[0] : keyOf(addDays(today(), -(+r - 1)));
  const inRange = keys.filter(k => k >= from);
  const pts = inRange.map(k => ({ k, w: data.weights[k] }));
  const ch = inRange.length > 1 ? data.weights[inRange[inRange.length - 1]] - data.weights[inRange[0]] : null;
  const low = pts.length ? Math.min(...pts.map(p => p.w)) : null;
  const kg = '<small>kg</small>';
  h += `<div class="stats three" style="margin-top:14px">${stat(fmtW(data.weights[keys[keys.length - 1]]) + kg, 'Latest')}${stat(ch == null ? '–' : signed(ch) + kg, 'Change', 'r')}${stat(low == null ? '–' : fmtW(low) + kg, 'Lowest', 'r')}</div>`;
  h += `<div style="height:14px"></div>` + seg([['30', '30 days'], ['90', '90 days'], ['all', 'All time']], 'wRange', r, 'r');
  h += `<div class="chart">${pts.length ? lineChart(pts, { w: 340, h: 170, axes: true }) : '<p class="chart-empty">No entries in this period.</p>'}</div>`;
  h += `<div class="sec"><h2>History</h2></div>`;
  const desc = keys.slice().reverse();
  const shown = ui.wShowAll ? desc : desc.slice(0, 20);
  for (const k of shown) {
    const i = keys.indexOf(k), prev = i > 0 ? data.weights[keys[i - 1]] : null, w = data.weights[k];
    const diff = prev == null ? '' : signed(w - prev);
    h += `<div class="hrow"><button class="main" data-act="editWeight" data-k="${k}" aria-label="Edit ${fmtShort(k)}"><span class="val">${fmtW(w)}</span><span class="sub">${esc(fmtDay(fromKey(k)))}</span></button><span class="diff">${diff}</span>${iconBtn('delWeight', 'trash', `Delete ${fmtShort(k)}`, `data-k="${k}"`)}</div>`;
  }
  if (!ui.wShowAll && desc.length > 20) h += `<button class="link" data-act="wMore">Show all ${desc.length} entries</button>`;
  return h;
}

/* ---------------- Render ---------------- */
const root = $('#app'), nav = $('#nav');
let lastSig = '', renderedDay = todayKey();
function render() {
  const sig = [route.name, route.date || '', route.mode || ''].join('|');
  const y = window.scrollY;
  let html;
  switch (route.name) {
    case 'calendar': html = viewCalendar(); break;
    case 'plan': html = viewPlan(); break;
    case 'weight': html = viewWeight(); break;
    case 'day': html = isKey(route.date) ? viewDay() : viewHome(); break;
    default: html = viewHome();
  }
  root.innerHTML = html;
  const isDay = route.name === 'day';
  nav.hidden = isDay;
  document.body.classList.toggle('no-nav', isDay);
  nav.querySelectorAll('button').forEach(b => { if (b.dataset.tab === route.name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  window.scrollTo(0, sig === lastSig ? y : 0);
  lastSig = sig;
  renderedDay = todayKey();
}

/* ---------------- Sheets & toast ---------------- */
function openSheet(html) {
  closeSheetDom(true);
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('click', e => { if (e.target === s) closeSheet(); });
  document.body.appendChild(s);
  sheetOpen = true;
  sheetPushed = hist('pushState', { r: route, sheet: 1 });
}
function closeSheet(then) {
  if (!sheetOpen) { if (then) then(); return; }
  afterClose = then || null;
  if (sheetPushed) {
    history.back();
    setTimeout(() => { if (sheetOpen) closeSheetDom(); }, 400);
  } else closeSheetDom();
}
function closeSheetDom(silent) {
  const s = $('.scrim');
  if (s) s.remove();
  sheetOpen = false; sheetPushed = false;
  const cb = afterClose; afterClose = null;
  if (cb && !silent) cb();
}
let toastTimer = null;
function toast(msg, undo) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  if (undo) t.querySelector('button').addEventListener('click', () => { undo(); t.remove(); });
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), undo ? 5000 : 2500);
}

/* ---------------- Actions ---------------- */
const curDay = () => data.days[route.date];
const findItem = id => itemsOf(curDay()).find(i => i.id === id);

const SAMPLE = [
  { type: 'gym', gym: [['Barbell bench press', 4, 6, 10], ['Incline dumbbell press', 4, 10, 10], ['Cable pushdown', 3, 12, 14]] },
  { type: 'cardio', cardio: [['Pickleball', 2, 'hr']] },
  { type: 'rest' },
  { type: 'gym', gym: [['Lat pulldown', 3, 10, 15], ['Seated cable row', 4, 12, 20]] },
  { type: 'cardio', cardio: [['Jogging', 10, 'km']] },
  { type: 'cardio', cardio: [['Golf', 1, 'session']] },
  { type: 'rest' }
];

const actions = {
  tab(el) { const t = el.dataset.tab; if (route.name === t) window.scrollTo(0, 0); else go({ name: t }, { replace: true }); },
  day(el) { go({ name: 'day', date: el.dataset.date, mode: el.dataset.mode || undefined, from: route }); },
  back() { if (navDepth > 0) history.back(); else go(route.from || { name: 'home' }, { replace: true }); },
  period(el) { ui.period = el.dataset.p; render(); },
  calGo(el) { go({ name: 'calendar', ym: el.dataset.ym }, { replace: true }); },
  wkGo(el) { go({ name: 'plan', wk: el.dataset.wk }, { replace: true }); },
  dayMode(el) { go({ ...route, mode: el.dataset.mode }, { replace: true }); },

  setType(el) {
    const d = ensureDay(route.date), t = el.dataset.type;
    d.type = t;
    if (t !== 'rest' && !itemsOf(d).length) actions.addItem(null, true);
    save(); render();
    if (t !== 'rest') { const inp = root.querySelector('[data-bind="name"]'); if (inp && !inp.value) inp.focus(); }
  },
  addItem(_el, silent) {
    const d = curDay(); if (!d || !d.type || d.type === 'rest') return;
    const it = d.type === 'gym'
      ? { id: uid(), name: '', plan: { sets: '', reps: '', weight: '' }, actual: null, done: false }
      : { id: uid(), name: '', plan: { amount: '', unit: 'min' }, actual: null, done: false };
    itemsOf(d).push(it);
    if (silent) return;
    save(); render();
    const inp = root.querySelector(`[data-bind="name"][data-id="${it.id}"]`); if (inp) inp.focus();
  },
  delItem(el) {
    const d = curDay(); if (!d) return;
    const list = itemsOf(d), i = list.findIndex(x => x.id === el.dataset.id); if (i < 0) return;
    const [removed] = list.splice(i, 1);
    save(true); render();
    toast(`Removed ${removed.name || 'item'}`, () => { list.splice(i, 0, removed); save(true); render(); });
  },
  clearDay() {
    const k = route.date, d = data.days[k]; if (!d) return;
    const snap = JSON.parse(JSON.stringify(d));
    delete data.days[k]; save(true); render();
    toast('Plan removed', () => { data.days[k] = snap; save(true); render(); });
  },
  toggleItem(el) {
    const d = curDay(), it = findItem(el.dataset.id); if (!it) return;
    it.done = !it.done;
    const its = itemsOf(d);
    if (its.length && its.every(i => i.done)) d.status = 'done';
    else if (d.status === 'done') d.status = null;
    save(true); render();
    if (d.status === 'done' && it.done) toast('Session done');
  },
  allDone() { const d = curDay(); if (!d) return; itemsOf(d).forEach(i => i.done = true); d.status = 'done'; save(true); render(); toast('Session done'); },
  markIncomplete() { const d = curDay(); if (!d) return; d.status = 'incomplete'; save(true); render(); toast('Marked incomplete'); },
  reopen() { const d = curDay(); if (!d) return; d.status = null; save(true); render(); },

  homeWeight() {
    const n = parseFloat($('#homeW').value);
    if (!(n > 0)) { toast('Enter your weight in kg'); return; }
    data.weights[todayKey()] = Math.round(n * 100) / 100; save(true); render(); toast('Weight saved');
  },
  saveWeight() {
    const k = $('#wDate').value, n = parseFloat($('#wVal').value);
    if (!isKey(k)) { toast('Pick a date'); return; }
    if (k > todayKey()) { toast("You can't log a future date"); return; }
    if (!(n > 0)) { toast('Enter your weight in kg'); return; }
    data.weights[k] = Math.round(n * 100) / 100; ui.wDate = null; save(true); render(); toast(`Saved for ${fmtShort(k)}`);
  },
  editWeight(el) { ui.wDate = el.dataset.k; render(); window.scrollTo(0, 0); const v = $('#wVal'); if (v) v.focus(); },
  delWeight(el) {
    const k = el.dataset.k, old = data.weights[k];
    delete data.weights[k]; save(true); render();
    toast(`Deleted ${fmtShort(k)}`, () => { data.weights[k] = old; save(true); render(); });
  },
  wRange(el) { ui.wRange = el.dataset.r; render(); },
  wMore() { ui.wShowAll = true; render(); },

  sampleWeek() {
    const wk = planWeek();
    SAMPLE.forEach((p, i) => {
      const k = keyOf(addDays(wk, i));
      if (isLogged(data.days[k])) return;
      data.days[k] = {
        type: p.type, status: null,
        gym: (p.gym || []).map(([name, sets, reps, weight]) => ({ id: uid(), name, plan: { sets, reps, weight }, actual: null, done: false })),
        cardio: (p.cardio || []).map(([name, amount, unit]) => ({ id: uid(), name, plan: { amount, unit }, actual: null, done: false }))
      };
    });
    save(true); render(); toast('Sample week added. Tap any day to edit it.');
  },
  copyWeek() {
    const wk = planWeek(), nw = addDays(wk, 7), nm = new Date(wk.getFullYear(), wk.getMonth() + 1, 1);
    openSheet(`<h3>Copy this week</h3><p class="sub">Copies the plan for ${fmtRange(wk, addDays(wk, 6))}, day by day. Days you've already logged won't be changed.</p>
      <label class="opt"><input type="radio" name="cw" value="next" checked><span class="grow"><b>Next week</b><span class="sub">${fmtRange(nw, addDays(nw, 6))}</span></span></label>
      <label class="opt"><input type="radio" name="cw" value="weeks"><span class="grow"><b>The next few weeks</b><span class="sub">Repeat for <select class="inp" id="cwN" aria-label="Number of weeks">${[2, 3, 4, 5, 6, 8, 12].map(n => `<option value="${n}"${n === 4 ? ' selected' : ''}>${n}</option>`).join('')}</select> weeks</span></span></label>
      <label class="opt"><input type="radio" name="cw" value="week"><span class="grow"><b>A specific week</b><span class="sub">Pick any day in that week</span><input class="inp" type="date" id="cwDate" value="${keyOf(addDays(wk, 14))}"></span></label>
      <label class="opt"><input type="radio" name="cw" value="month"><span class="grow"><b>Every week of a month</b><span class="sub">Fills each day of that month using this week's pattern</span><input class="inp" type="month" id="cwMonth" value="${keyOf(nm).slice(0, 7)}"></span></label>
      <div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="doCopyWeek">Copy plan</button></div>`);
  },
  doCopyWeek() {
    const src = planWeek(), srcKeys = [0, 1, 2, 3, 4, 5, 6].map(i => keyOf(addDays(src, i)));
    if (!srcKeys.some(k => data.days[k] && data.days[k].type)) { toast('This week has no plan to copy'); return; }
    const choice = ($('input[name=cw]:checked') || {}).value;
    const pairs = [];
    const pairFor = dt => [keyOf(addDays(src, (dt.getDay() + 6) % 7)), keyOf(dt)];
    if (choice === 'next' || choice === 'weeks') {
      const n = choice === 'next' ? 1 : parseInt($('#cwN').value, 10) || 1;
      for (let w = 1; w <= n; w++) for (let i = 0; i < 7; i++) pairs.push(pairFor(addDays(src, 7 * w + i)));
    } else if (choice === 'week') {
      const v = $('#cwDate').value;
      if (!isKey(v)) { toast('Pick a date in the week you want'); return; }
      const tw = mondayOf(fromKey(v));
      if (keyOf(tw) === keyOf(src)) { toast('Pick a different week'); return; }
      for (let i = 0; i < 7; i++) pairs.push(pairFor(addDays(tw, i)));
    } else if (choice === 'month') {
      const v = $('#cwMonth').value;
      if (!/^\d{4}-\d{2}$/.test(v)) { toast('Pick a month'); return; }
      const [y, m] = v.split('-').map(Number), last = new Date(y, m, 0).getDate();
      for (let dn = 1; dn <= last; dn++) { const dt = new Date(y, m - 1, dn); if (!srcKeys.includes(keyOf(dt))) pairs.push(pairFor(dt)); }
    }
    const res = applyCopy(pairs);
    closeSheet(() => { render(); copyResult(res); });
  },
  clearWeek() {
    const wk = planWeek();
    openSheet(`<h3>Clear this week?</h3><p class="sub">Removes the plan for ${fmtRange(wk, addDays(wk, 6))}. Days you've already logged stay as they are.</p><div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn danger" data-act="doClearWeek">Clear week</button></div>`);
  },
  doClearWeek() {
    const wk = planWeek(), snap = {};
    for (let i = 0; i < 7; i++) {
      const k = keyOf(addDays(wk, i)), d = data.days[k];
      if (d && !isLogged(d)) { snap[k] = d; delete data.days[k]; }
    }
    save(true);
    closeSheet(() => { render(); toast('Week cleared', () => { Object.assign(data.days, snap); save(true); render(); }); });
  },
  copyDay() {
    const k = route.date, dt = fromKey(k), d = data.days[k];
    if (!d || !d.type) { toast('Set up this day first'); return; }
    openSheet(`<h3>Copy ${DOW[dt.getDay()]}'s plan</h3><p class="sub">Days you've already logged won't be changed.</p>
      <label class="field"><span>Copy to</span><input class="inp" type="date" id="cdDate" value="${keyOf(addDays(dt, 7))}"></label>
      <label class="check-row"><input type="checkbox" id="cdRepeat"><span>Also repeat on the same weekday until the end of that month</span></label>
      <div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="doCopyDay">Copy plan</button></div>`);
  },
  doCopyDay() {
    const k = route.date, v = $('#cdDate').value;
    if (!isKey(v)) { toast('Pick a date'); return; }
    if (v === k) { toast('Pick a different date'); return; }
    const pairs = [[k, v]];
    if ($('#cdRepeat').checked) {
      const start = fromKey(v);
      for (let d = addDays(start, 7); d.getMonth() === start.getMonth(); d = addDays(d, 7)) pairs.push([k, keyOf(d)]);
    }
    const res = applyCopy(pairs);
    closeSheet(() => { render(); copyResult(res); });
  },

  settings() {
    const n = Object.keys(data.days).length, w = Object.keys(data.weights).length;
    openSheet(`<h3>Settings</h3><p class="sub">Your data is stored only on this phone, inside this app (${n} planned ${n === 1 ? 'day' : 'days'}, ${w} weigh-${w === 1 ? 'in' : 'ins'}). Export a backup now and then, especially before clearing Chrome's data or changing phones.</p>
      <div style="margin-top:8px">
      <button class="set-row" data-act="exportData">${icon('download')}<span class="grow"><b>Export backup</b><span class="sub">Saves a .json file to your Downloads</span></span></button>
      <button class="set-row" data-act="importData">${icon('upload')}<span class="grow"><b>Import backup</b><span class="sub">Replaces everything with a backup file</span></span></button>
      <button class="set-row danger" data-act="eraseData">${icon('trash')}<span class="grow"><b>Erase all data</b><span class="sub">Deletes every plan, log and weigh-in</span></span></button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <div class="sheet-actions" style="grid-template-columns:1fr"><button class="btn ghost" data-act="closeSheet">Done</button></div>`);
  },
  exportData() {
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `plates-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Backup exported');
  },
  importData() { const f = $('#importFile'); if (f) f.click(); },
  doImport() {
    if (!ui.pendingImport) return;
    data = ui.pendingImport; ui.pendingImport = null; save(true);
    closeSheet(() => { render(); toast('Backup imported'); });
  },
  eraseData(el) {
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.querySelector('b').textContent = 'Tap again to erase everything'; return; }
    data = blank(); save(true);
    closeSheet(() => { render(); toast('All data erased'); });
  },
  closeSheet() { closeSheet(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

function onInput(e) {
  const el = e.target;
  if (el.dataset.bind) {
    const it = findItem(el.dataset.id); if (!it) return;
    const path = el.dataset.bind;
    if (path === 'name') it.name = el.value;
    else {
      const [grp, f] = path.split('.');
      if (grp === 'actual' && !it.actual) it.actual = curDay().type === 'gym' ? { sets: it.plan.sets, reps: it.plan.reps, weight: it.plan.weight } : { amount: it.plan.amount };
      it[grp][f] = f === 'unit' ? el.value : numOr(el.value);
    }
    save();
  } else if (el.dataset.wday) {
    const n = parseFloat(el.value), k = el.dataset.wday;
    if (n > 0) data.weights[k] = Math.round(n * 100) / 100;
    else if (el.value === '') delete data.weights[k];
    save();
  }
}
document.addEventListener('input', onInput);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.bind) onInput(e);
  if (el.id === 'wDate') { ui.wDate = el.value; const v = $('#wVal'); if (v) v.value = data.weights[el.value] ?? ''; }
  if (el.id === 'importFile' && el.files && el.files[0]) {
    const file = el.files[0], reader = new FileReader();
    reader.onload = () => {
      let obj = null;
      try { obj = JSON.parse(reader.result); } catch (err) {}
      if (!obj || typeof obj !== 'object' || (!obj.days && !obj.weights)) { toast("That file isn't a Plates backup"); return; }
      const n = normalize(obj);
      ui.pendingImport = n;
      const sheet = $('.sheet');
      if (sheet) sheet.innerHTML = `<h3>Replace your data?</h3><p class="sub">${esc(file.name)} has ${Object.keys(n.days).length} planned days and ${Object.keys(n.weights).length} weigh-ins. Everything currently in the app will be replaced.</p><div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn danger" data-act="doImport">Replace data</button></div>`;
    };
    reader.readAsText(file);
  }
});
document.addEventListener('focusin', e => {
  const opt = e.target.closest && e.target.closest('.opt');
  if (opt && e.target.type !== 'radio') { const r = opt.querySelector('input[type=radio]'); if (r) r.checked = true; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'homeW') actions.homeWeight();
  if (e.key === 'Enter' && e.target.id === 'wVal') actions.saveWeight();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) flush();
  else if (todayKey() !== renderedDay) render();
});
window.addEventListener('pagehide', flush);

/* ---------------- Start ---------------- */
hist('replaceState', { r: route });
render();

if (Store.persistent && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
